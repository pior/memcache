# DevBuddy config file
# See https://github.com/devbuddy/devbuddy/blob/master/docs/Config.md

env:
  ENV: development

up:
  - go:
      version: 1.26.8
      modules: true
  # - custom:
  #     name: Install golangci-lint
  #     met?: which golangci-lint && golangci-lint --version | grep -q '2.13.2'
  #     meet: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.13.2
  # - memcached

commands:
  ci:
    desc: Run all CI checks
    run: |
      go mod tidy -diff &&
        golangci-lint run &&
        go test -v -race ./... &&
        (
          cd otelmemcache &&
          go mod tidy -diff &&
          golangci-lint run &&
          go test -v -race ./...
        )

  test:
    desc: Run all tests
    run: go test -v ./... && (cd otelmemcache && go test -v ./...)

  test-otelmemcache:
    desc: Run OpenTelemetry adapter tests
    run: cd otelmemcache && go test -v ./...

  test-integration:
    desc: Run integration tests (requires memcached on 127.0.0.1:11211)
    run: go test -v -run TestIntegration ./...

  test-stress:
    desc: Run stress/load tests (requires memcached; STRESS_DURATION and STRESS_WORKERS to tune)
    run: cd stress && go test -race -v -run TestStress ./...

  test-client:
    desc: Run client unit tests only
    run: go test -v -run '^TestClient_' .

  test-meta:
    desc: Run meta protocol tests
    run: go test -v ./meta

  bench:
    desc: Run client benchmarks
    run: go test -bench=BenchmarkClient -benchmem -run=^$ .

  bench-meta:
    desc: Run pool benchmarks (both channel and puddle)
    run: go test -bench=Benchmark -benchmem -run=^$ ./meta

  bench-pool:
    desc: Run pool benchmarks (both channel and puddle)
    run: go test -bench=BenchmarkPool -benchmem -run=^$ .

  fuzz:
    desc: Run every fuzz target for 30s each (pass a duration, e.g. `bud fuzz 5m`)
    run: ./scripts/fuzz.sh "${1:-30s}"

  fuzz-seeds:
    desc: Run every fuzz target against its seed corpus only (what CI does)
    run: go test -run='^Fuzz' ./... && (cd stress && go test -run='^Fuzz' ./...)

  fuzz-one:
    desc: Fuzz a single target, e.g. `bud fuzz-one FuzzReadResponse 5m`
    run: ./scripts/fuzz.sh "${2:-30s}" "$1"
  lint:
    desc: Lint the project
    run: golangci-lint run && (cd otelmemcache && golangci-lint run)

  # loadtest commands now live in the nested loadtest/dev.yml (run `bud` from there)

open:
  devbuddy: https://github.com/devbuddy/devbuddy/blob/master/docs/Config.md#config-devyml
